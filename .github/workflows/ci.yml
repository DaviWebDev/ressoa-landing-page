name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo ghcr.io/betterleaks/betterleaks:v1.10.0@sha256:c6dfa75145fe5b31fdaf02feff18a73f1e11df8ca04876522f87f857656c83ca git /repo --redact
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        if: ${{ hashFiles('src/**') != '' }}
        with:
          python-version: "3.12"
      - name: Install Semgrep
        if: ${{ hashFiles('src/**') != '' }}
        run: |
          python -m pip install --user pipx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pipx" install "semgrep==1.184.0"
      - name: Security scan with Semgrep
        if: ${{ hashFiles('src/**') != '' }}
        run: pnpm security:scan
      - run: pnpm lint
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm astro check
      - run: pnpm build

  # ── PR: lightweight ──
  e2e-pr:
    name: E2E (${{ matrix.project }})
    if: github.event_name == 'pull_request'
    needs: [check]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: chromium
            project: "Mobile Chrome"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        if: hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
      - run: pnpm exec playwright test --project="${{ matrix.project }}"
        if: hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
      - if: always() && hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Merge: full matrix ──
  e2e-main:
    if: github.event_name == 'push'
    needs: [check]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            project: chromium
          - browser: firefox
            project: firefox
          - browser: webkit
            project: webkit
          - browser: chromium
            project: "Mobile Chrome"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
        if: hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
      - run: pnpm exec playwright test --project="${{ matrix.project }}"
        if: hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
      - if: always() && hashFiles('tests/**/*.spec.*', 'tests/**/*.test.*') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
